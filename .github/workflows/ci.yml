name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test on Node ${{ matrix.node-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]
        node-version: [ 18.x, 20.x, 22.x ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Check syntax & JS module validation
        run: npm run check

      - name: Run test suite (Node 18)
        if: matrix.node-version == '18.x'
        run: npm test

      - name: Run test suite with experimental coverage (Node 20+)
        if: matrix.node-version != '18.x'
        run: npm run test:coverage

      - name: Upload coverage artifact (Ubuntu / Node 22)
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '22.x'
        uses: actions/upload-artifact@v4
        with:
          name: lcov-coverage
          path: coverage/lcov.info

      - name: Output summary
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '22.x'
        run: |
          echo "## 🧪 Test & Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ All 80 automated unit & integration tests executed successfully on Node ${{ matrix.node-version }}!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 Coverage Breakdown" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          node tools/coverage-summary.mjs >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Full LCOV report uploaded as \`lcov-coverage\` artifact." >> $GITHUB_STEP_SUMMARY

  browser:
    name: Headless browser journeys
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Setup Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: 130.0.6723.31
          install-dependencies: true

      - name: Run browser journeys
        run: npm run test:e2e
        env:
          CHROMIUM_BIN: ${{ steps.chrome.outputs.chrome-path }}
          E2E_ARTIFACT_DIR: ${{ github.workspace }}/artifacts/e2e

      - name: Upload browser journey artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-journey-artifacts
          path: artifacts/e2e
          if-no-files-found: warn
